id = "local.tab-numbers"
name = "Tab numbers"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Prefix every tab label with its position, so labels match prefix+1..9"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "number-tabs.sh"]

[[events]]
on = "tab.created"
command = ["sh", "number-tabs.sh"]

[[events]]
on = "tab.closed"
command = ["sh", "number-tabs.sh"]

[[events]]
on = "tab.moved"
command = ["sh", "number-tabs.sh"]

[[events]]
on = "tab.renamed"
command = ["sh", "number-tabs.sh"]
